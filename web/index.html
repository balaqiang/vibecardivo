<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibecard · Profile cards for your GitHub README</title>
    <meta name="description" content="Vibecard builds a dynamic SVG profile card for your GitHub README: 13 themes, 38 social platforms, live preview." />
    <meta name="author" content="Balaqiang" />
    <meta name="theme-color" content="#25292e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const saved = localStorage.getItem('vibecard:scheme');
        const dark = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
